name:flabbench

channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - numpy=1.26.4
  - pandas
  - scikit-learn=1.0.2
  - scipy
  - matplotlib
  - plotly
  - networkx
  - lightgbm
  - catboost
  - py-xgboost
  - imbalanced-learn
  - numba
  - shap
  - tqdm
  - jupyterlab
  - ipywidgets
  - notebook
  - python-graphviz
  - pip
  - pip:
    - --index-url https://download.pytorch.org/whl/cu117
    - torch==2.0.0+cu117
    - torchvision==0.15.1+cu117
    - torchaudio==2.0.1
    - optuna==4.8.0
    - transformers==4.35.2